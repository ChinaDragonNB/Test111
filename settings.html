<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="设置起点的外观与阅读字号，让浏览更符合你的习惯。" />
    <title>设置 · 起点</title>
    <style>
      :root { color-scheme: light; --ink: #243b35; --muted: #64736b; --green: #31664d; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
      .container { width: min(100% - 48px, 1040px); margin-inline: auto; }
      header { display: flex; align-items: center; justify-content: space-between; padding-block: 28px; }
      .brand { color: var(--ink); font-size: 22px; font-weight: 750; text-decoration: none; letter-spacing: 2px; }
      .brand span { color: var(--green); }
      nav { display: flex; align-items: center; gap: 24px; }
      nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
      :is(a, button, select):focus-visible { outline: 3px solid var(--green); outline-offset: 5px; }
      .hero { padding: 72px 0 40px; max-width: 740px; }
      .eyebrow { margin: 0 0 22px; color: var(--green); font-size: 13px; font-weight: 650; letter-spacing: 3px; }
      h1 { margin: 0 0 24px; font-size: clamp(40px, 7vw, 72px); line-height: 1.2; letter-spacing: -2px; }
      .intro { margin: 0; color: var(--muted); font-size: 18px; }
      .settings { max-width: 740px; padding-bottom: 80px; }
      .card { padding: 32px; border: 1px solid var(--border); border-radius: 14px; }
      h2 { margin: 0 0 8px; font-size: 22px; }
      .hint { margin: 0; color: var(--muted); font-size: 15px; }
      .field { display: grid; grid-template-columns: 1fr 180px; align-items: center; gap: 24px; padding-block: 24px; border-bottom: 1px solid var(--border); }
      label { display: block; margin-bottom: 4px; font-weight: 650; }
      select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--page); color: var(--ink); font: inherit; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      button { min-height: 44px; padding: 10px 22px; border: 1px solid transparent; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
      .secondary { border-color: var(--border); background: var(--surface); color: var(--ink); }
      .secondary:hover { background: var(--page); }
      #save-status { min-height: 1.7em; margin: 16px 0 0; color: var(--muted); }
      footer { padding: 24px 0; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
      @media (max-width: 640px) {
        .container { width: calc(100% - 40px); }
        .hero { padding: 48px 0 32px; }
        h1 { letter-spacing: -1px; }
        .card { padding: 24px; }
        .field { grid-template-columns: 1fr; gap: 12px; }
        .settings { padding-bottom: 48px; }
      }
    </style>
    <link rel="stylesheet" href="./preferences.css" />
    <script src="./preferences.js"></script>
  </head>
  <body>
    <header class="container">
      <a class="brand" href="./index.html" aria-label="起点首页"><span>●</span> 起点</a>
      <nav aria-label="主导航"><a href="./index.html">首页</a><a href="./about.html">关于</a><a href="./settings.html" aria-current="page">设置</a></nav>
    </header>
    <main class="container">
      <section class="hero" aria-labelledby="settings-title">
        <p class="eyebrow">按自己的习惯，慢慢探索</p>
        <h1 id="settings-title">设置</h1>
        <p class="intro">调整一点细节，让这里更适合你。</p>
      </section>
      <section class="settings" aria-labelledby="preferences-title">
        <form id="settings-form" class="card">
          <h2 id="preferences-title">浏览偏好</h2>
          <p class="hint">设置仅保存在当前浏览器中，并应用于本站所有页面。</p>
          <div class="field">
            <div><label for="theme">外观主题</label><p id="theme-hint" class="hint">选择喜欢的外观，或跟随系统自动切换。</p></div>
            <select id="theme" name="theme" aria-describedby="theme-hint"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select>
          </div>
          <div class="field">
            <div><label for="font-size">阅读字号</label><p id="font-hint" class="hint">调整正文与导航的文字大小。</p></div>
            <select id="font-size" name="fontSize" aria-describedby="font-hint"><option value="standard">标准</option><option value="large">大号</option></select>
          </div>
          <div class="actions"><button class="button" type="submit">保存设置</button><button id="reset-settings" class="secondary" type="button">恢复默认</button></div>
          <p id="save-status" role="status" aria-live="polite"></p>
          <noscript><p>请启用 JavaScript，以保存和应用浏览偏好。</p></noscript>
        </form>
      </section>
    </main>
    <footer><div class="container">起点 · 美好，从一个小小的开始发生。</div></footer>
  </body>
</html>
