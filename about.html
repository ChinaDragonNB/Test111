<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="关于起点：留一点空间给灵感，让小小的想法慢慢成为日常。" />
    <title>关于 · 起点</title>
    <style>
      :root { color-scheme: light; --ink: #243b35; --muted: #64736b; --green: #31664d; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #f7f8f2; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.7; }
      .container { width: min(100% - 48px, 1040px); margin-inline: auto; }
      header { display: flex; align-items: center; justify-content: space-between; padding-block: 28px; }
      .brand { color: var(--ink); font-size: 22px; font-weight: 750; text-decoration: none; letter-spacing: 2px; }
      .brand span { color: var(--green); }
      nav { display: flex; align-items: center; gap: 24px; }
      nav a { color: var(--muted); text-decoration: none; font-size: 14px; }
      nav a[aria-current="page"] { color: var(--green); font-weight: 650; }
      a:focus-visible { outline: 3px solid var(--green); outline-offset: 5px; }
      .hero { padding: 100px 0 64px; max-width: 740px; }
      .eyebrow { margin: 0 0 22px; color: var(--green); font-size: 13px; font-weight: 650; letter-spacing: 3px; }
      h1 { margin: 0 0 24px; font-size: clamp(40px, 7vw, 72px); line-height: 1.2; letter-spacing: -2px; }
      .intro { max-width: 560px; margin: 0; color: var(--muted); font-size: 18px; }
      .story { max-width: 740px; padding-bottom: 80px; }
      .card { padding: 32px; border: 1px solid #dfe5d9; border-radius: 14px; background: #fff; }
      h2 { margin: 0 0 16px; font-size: 22px; }
      .card p { margin: 0 0 16px; color: var(--muted); }
      .card p:last-child { margin-bottom: 0; }
      .back { display: inline-block; margin-top: 28px; color: var(--green); text-decoration: none; font-weight: 600; }
      .back:hover { text-decoration: underline; }
      footer { padding: 24px 0; border-top: 1px solid #dfe5d9; color: var(--muted); font-size: 13px; }
      @media (max-width: 640px) {
        .container { width: calc(100% - 40px); }
        .hero { padding: 64px 0 40px; }
        h1 { letter-spacing: -1px; }
        .card { padding: 24px; }
        .story { padding-bottom: 48px; }
      }
    </style>
    <link rel="stylesheet" href="./preferences.css" />
    <script src="./preferences.js"></script>
  </head>
  <body>
    <header class="container">
      <a class="brand" href="./index.html" aria-label="起点首页"><span>●</span> 起点</a>
      <nav aria-label="主导航"><a href="./index.html">首页</a><a href="./about.html" aria-current="page">关于</a><a href="./settings.html">设置</a></nav>
    </header>
    <main class="container">
      <section class="hero" aria-labelledby="about-title">
        <p class="eyebrow">关于这个小小的起点</p>
        <h1 id="about-title">给好奇心，<br />留一个位置。</h1>
        <p class="intro">起点是一个收集灵感、记录日常的小角落。这里没有标准答案，只有一些值得分享的想法，和慢慢探索的耐心。</p>
      </section>
      <section class="story" aria-labelledby="story-title">
        <div class="card">
          <h2 id="story-title">从一件小事开始</h2>
          <p>有时候，一个新点子来自路上的风景、一页书，或一次随意的聊天。我们想把这些容易被忽略的瞬间留下来，让它们成为下一次行动的起点。</p>
          <p>我们相信，保持好奇、认真尝试、享受当下，就能让普通的日子多一点趣味。不必急着抵达，沿途也有值得停下来的风景。</p>
          <p>谢谢你来到这里。希望你也能带着一点灵感，开始属于自己的小小探索。</p>
        </div>
        <a class="back" href="./index.html">返回首页 <span aria-hidden="true">→</span></a>
      </section>
    </main>
    <footer><div class="container">起点 · 美好，从一个小小的开始发生。</div></footer>
  </body>
</html>
